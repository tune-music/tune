<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Tune Music</title>
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #09090b; color: #fafafa;
      font: 14px/1.45 "Segoe UI", system-ui, sans-serif; user-select: none;
    }
    .box { width: 380px; text-align: center; }
    .logo { color: #facc15; margin-bottom: 18px; }
    h1 { margin: 0 0 6px; font-size: 18px; font-weight: 600; }
    p { margin: 0; color: #a1a1aa; font-size: 13px; }
    .bar { height: 6px; margin: 22px 0 10px; border-radius: 3px; background: #27272a; overflow: hidden; }
    .fill { height: 100%; width: 0; background: #facc15; transition: width .2s; }
    .bar.indeterminate .fill { width: 30%; animation: slide 1.2s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
    .meta { display: flex; justify-content: space-between; color: #71717a; font-size: 12px; }
    .error { display: none; margin-top: 18px; padding: 10px 12px; border: 1px solid #7f1d1d; border-radius: 6px; color: #fca5a5; font-size: 13px; text-align: left; user-select: text; }
    button {
      display: none; margin-top: 14px; height: 32px; padding: 0 16px; border: 0; border-radius: 6px;
      background: #facc15; color: #18181b; font: inherit; font-weight: 500; cursor: pointer;
    }
    button:hover { background: #eab308; }
    .failed .error, .failed button { display: inline-block; }
    .failed .bar, .failed .meta { display: none; }
    .titlebar { position: fixed; inset: 0 0 auto 0; height: 32px; display: flex; justify-content: flex-end; app-region: drag; -webkit-app-region: drag; }
    .titlebar span { margin-right: auto; padding: 8px 12px; color: #71717a; font-size: 12px; }
    .titlebar .wbtn { display: block; width: 46px; height: 32px; margin: 0; border-radius: 0; background: transparent; color: #a1a1aa; font-size: 16px; line-height: 32px; app-region: no-drag; -webkit-app-region: no-drag; }
    .titlebar .wbtn:hover { background: #27272a; color: #fafafa; }
    .titlebar .wbtn.close:hover { background: #c42b1c; }
  </style>
</head>
<body>
  <div class="titlebar">
    <span>Tune Music</span>
    <button class="wbtn" id="min" aria-label="Свернуть">&#x2013;</button>
    <button class="wbtn close" id="close" aria-label="Закрыть">&#x2715;</button>
  </div>
  <div class="box" id="box">
    <svg class="logo" viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/>
      <line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/>
      <line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/>
      <line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>
    </svg>
    <h1 id="title">Подготовка Tune Music</h1>
    <p id="subtitle">Скачиваем Яндекс Музыку с серверов Яндекса. Это нужно только при первом запуске.</p>
    <div class="bar indeterminate" id="bar"><div class="fill" id="fill"></div></div>
    <div class="meta"><span id="stage">Подключение…</span><span id="amount"></span></div>
    <div class="error" id="error"></div>
    <div><button id="retry">Попробовать снова</button></div>
  </div>
  <script>
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;
    const $ = (id) => document.getElementById(id);
    const STAGES = { download: 'Скачивание', verify: 'Проверка файла', extract: 'Распаковка', done: 'Запуск' };
    const mb = (n) => (n / 1048576).toFixed(1).replace('.', ',') + ' МБ';

    function render(s) {
      $('box').classList.toggle('failed', s.state === 'failed');
      if (s.state === 'failed') {
        $('title').textContent = 'Не удалось подготовить Яндекс Музыку';
        $('subtitle').textContent = 'Проверьте подключение к интернету.';
        $('error').textContent = s.error || 'Неизвестная ошибка';
        return;
      }
      $('title').textContent = 'Подготовка Tune Music';
      const p = s.progress;
      if (!p) return;
      $('stage').textContent = STAGES[p.stage] || '';
      const known = p.total > 0;
      $('bar').classList.toggle('indeterminate', !known);
      $('fill').style.width = known ? Math.min(100, (p.done / p.total) * 100).toFixed(1) + '%' : '';
      $('amount').textContent = p.stage === 'download' && known ? `${mb(p.done)} из ${mb(p.total)}` : known ? Math.round((p.done / p.total) * 100) + '%' : '';
    }

    listen('client-state', (e) => render(e.payload));
    invoke('client_status').then((r) => {
      $('subtitle').textContent = `Скачиваем Яндекс Музыку ${r.version} с серверов Яндекса. Это нужно только при первом запуске.`;
      render(r.status);
    });
    const win = window.__TAURI__.window.getCurrentWindow();
    $('min').addEventListener('click', () => win.minimize());
    $('close').addEventListener('click', () => win.close());
    $('retry').addEventListener('click', () => {
      render({ state: 'installing', progress: null });
      invoke('client_retry');
    });
  </script>
</body>
</html>
