[package]
name = "tune-music"
version = "0.1.1"
description = "Tune — клиент Яндекс Музыки с темами и плагинами"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
discord-rich-presence = "1"
souvlaki = "0.8.3"
sevenz-rust2 = { version = "0.20.2", default-features = false }
ureq = "3.5.0"
sha2 = "0.11.1"
base64 = "0.23.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
aes = "0.8"
ctr = "0.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows-core = "0.62.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Storage_EnhancedStorage", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging", "Win32_Media_Audio", "Win32_System_Diagnostics_ToolHelp", "Win32_Graphics_Dwm", "Win32_UI_Accessibility"] }

